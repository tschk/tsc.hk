name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(grep -A2 'name = "wasm-bindgen"' runtime/Cargo.lock | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "wasm-bindgen $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build runtime WASM
        run: bash scripts/build-runtime.sh

      - name: Generate View IR (native crepuscularity)
        run: bash scripts/build-ir.sh

      - name: Verify generated IR
        run: |
          test -f src/generated/view-ir.json
          grep -q '"version": 7' src/generated/view-ir.json
          grep -q '"id": "tsc-heading"' src/generated/view-ir.json
          echo "✓ IR version 7 with #tsc-heading"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build site
        run: bun run build

      - name: Verify artifacts
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/vendor/unocss.js
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/agent.md
          test -f dist/robots.txt
          test -f dist/pkg/tsc_hk_runtime.js
          test -f dist/pkg/tsc_hk_runtime_bg.wasm
          echo "✓ all artifacts present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
