name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(grep -A2 'name = "wasm-bindgen"' runtime/Cargo.lock | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "wasm-bindgen $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build runtime WASM
        run: bash scripts/build-runtime.sh

      - name: Generate View IR (native crepuscularity)
        run: bash scripts/build-ir.sh

      - name: Verify generated IR
        run: |
          test -f src/generated/view-ir.json
          grep -q '"version": 7' src/generated/view-ir.json
          grep -q '"id": "tsc-heading"' src/generated/view-ir.json
          test -f src/generated/telekinesis-ir.json
          grep -q '"version": 7' src/generated/telekinesis-ir.json
          grep -q '"id": "tk-heading"' src/generated/telekinesis-ir.json
          echo "✓ IR version 7 with #tsc-heading and #tk-heading"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build site
        run: bun run build

      - name: Verify artifacts
        run: |
          test -f dist/index.html
          test -f dist/telekinesis/index.html
          grep -q telekinesis dist/index.html
          grep -q 'id="tk-heading"' dist/telekinesis/index.html
          test -f dist/.nojekyll
          test -f dist/vendor/unocss.js
          test -f dist/site.css
          test -f dist/404.html
          test -f dist/sitemap.xml
          grep -q 'https://tsc.hk/telekinesis/' dist/sitemap.xml
          grep -q 'Sitemap: https://tsc.hk/sitemap.xml' dist/robots.txt
          grep -q '<html lang="en">' dist/index.html
          grep -q '<h1' dist/index.html
          grep -q '<main' dist/index.html
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/agent.md
          test -f dist/robots.txt
          test -f dist/pkg/tsc_hk_runtime.js
          test -f dist/pkg/tsc_hk_runtime_bg.wasm
          echo "✓ all artifacts present"

      - name: Record deployed revision
        run: printf '%s\n' "$GITHUB_SHA" > dist/deployed-revision.txt

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    environment:
      name: cloudflare-pages
      url: https://tsc.hk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN with Pages Edit access to the production account."
            exit 1
          fi
      - name: Deploy to the Pages project serving tsc.hk
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fc62a6e6528bec6d3d81c3bf8967ceeb
          wranglerVersion: "4.101.0"
          command: pages deploy dist --project-name tschk-hk --branch master --commit-hash ${{ github.sha }}
      - name: Verify the public domain serves this revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            revision="$(curl --fail --silent --show-error --max-time 15 "https://tsc.hk/deployed-revision.txt?sha=$EXPECTED_SHA" || true)"
            if [[ "$revision" == "$EXPECTED_SHA" ]]; then break; fi
            echo "Waiting for public revision ($attempt/30)"
            sleep 10
          done
          test "$revision" = "$EXPECTED_SHA"
          curl --fail --silent --show-error --max-time 30 "https://tsc.hk/?sha=$EXPECTED_SHA" > home.html
          grep -q '<main' home.html
          grep -q 'href="https://github.com/plyght/wax"' home.html
          if grep -q 'href="https://github.com/tschk/subspace"' home.html; then
            echo "::error::Public homepage still links to the private subspace repository."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "https://tsc.hk/telekinesis/?sha=$EXPECTED_SHA" > telekinesis.html
          grep -q 'id="tk-heading"' telekinesis.html
          echo "Verified https://tsc.hk serves $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
