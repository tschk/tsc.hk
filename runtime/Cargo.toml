[package]
name = "tsc_hk_runtime"
version = "0.1.0"
edition = "2021"
license = "ISC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document", "Element", "HtmlElement", "HtmlHeadElement", "Node", "Window",
    "EventTarget",
    "Navigator", "Clipboard",
    "NodeList",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[workspace]
